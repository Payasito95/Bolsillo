<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E7A58">
<script>try{var t=(JSON.parse(localStorage.getItem("bolsillo:v1")||"{}").settings||{}).theme;if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="description" content="Tus gastos en pesos y dólares, con plan semanal, cuotas y fijos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bolsillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: una columna de bolsillo, carga rápida arriba, pestañas abajo como billetera */
:root{
  --bg:#EFF3EE; --surface:#FFFFFF; --sunk:#E3EAE3; --ink:#14231C; --muted:#5B6B62; --line:#D3DDD5;
  --accent:#1E7A58; --accent-ink:#FFFFFF; --usd:#2D58A8; --bad:#BF3E2B; --warn:#B87B0C; --good:#1E7A58; --field:#7A8D82;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1814; --surface:#17231D; --sunk:#1E2C25; --ink:#E6EEE9; --muted:#93A59B; --line:#2A3A32;
  --accent:#4CC08E; --accent-ink:#06140D; --usd:#7FA6EE; --bad:#F07C68; --warn:#E5AE45; --good:#4CC08E; --field:#5E7468; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1814; --surface:#17231D; --sunk:#1E2C25; --ink:#E6EEE9; --muted:#93A59B; --line:#2A3A32;
  --accent:#4CC08E; --accent-ink:#06140D; --usd:#7FA6EE; --bad:#F07C68; --warn:#E5AE45; --good:#4CC08E; --field:#5E7468; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.listening{background:var(--bad)!important;color:#fff!important;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.listening{animation:none}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:800}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:1.5rem}
.brand span{color:var(--accent)}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav button{border:0;background:var(--sunk);width:32px;height:32px;border-radius:50%}
.monthnav b{min-width:96px;text-align:center;font-weight:600;text-transform:capitalize}

/* carga rápida */
.quick{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.qrow{display:flex;gap:8px}
.qrow input{flex:1;min-width:0;border:1px solid var(--field);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px;font:inherit}
.btn{border:0;border-radius:10px;padding:0 14px;min-height:46px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn svg{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:.82rem;color:var(--muted)}
.toast span{min-width:0;overflow-wrap:anywhere}
.banner{background:var(--surface);border:1px solid var(--warn);border-left-width:4px;border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.goal{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0;padding-top:0}
.goalbar{height:10px;border-radius:10px;background:var(--sunk);overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--accent);border-radius:10px}
.subs{grid-column:1/-1;font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.chiplist{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:999px;padding:3px 4px 3px 10px;font-size:.85rem;max-width:100%}
.tag button{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:50%}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0;border:1px solid var(--field);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit}
.search{width:100%;border:1px solid var(--field);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.ln .chip{white-space:nowrap}
.wrap,.wrap > *{min-width:0}
.alert,.ledger .ln span:first-child{overflow-wrap:anywhere;min-width:0}
.toast{font-size:.9rem;padding:8px 10px;border-radius:10px;background:var(--sunk);display:flex;justify-content:space-between;gap:8px;align-items:center}
.toast button{border:0;background:none;color:var(--accent);font-weight:600}

/* resumen */
.balance{display:flex;flex-direction:column;gap:4px}
.balance .big{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1.05;font-variant-numeric:tabular-nums}
.balance .big.neg{color:var(--bad)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.trio .v{font-family:var(--mono);font-weight:600;font-size:.95rem;overflow-wrap:anywhere}
.cur{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.cur button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--muted)}
.cur button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.rate{font-size:.82rem}

.alert{border-left:4px solid var(--warn);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:.9rem}
.alert.bad{border-color:var(--bad)}

section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

.cats{display:flex;flex-direction:column;gap:10px}
.catrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.catrow .name{display:flex;align-items:center;gap:8px;min-width:0}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.bar{grid-column:1/-1;height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .t{min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--muted)}
.amt{font-family:var(--mono);font-weight:600;text-align:right;white-space:nowrap}
.amt.in{color:var(--good)}
.pill{font-size:.7rem;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:1px}
.pill.usd{color:var(--usd)}

.empty{text-align:center;padding:18px 8px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}

/* cuotas */
.statement{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-end}
.months{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:16px}
.months .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.months .m i{display:block;width:100%;background:var(--accent);opacity:.85;border-radius:5px 5px 0 0;min-height:2px}
.months .m:first-child i{opacity:1}
.months .m span{font-size:.7rem;color:var(--muted);text-transform:capitalize}
.months .m em{font-style:normal;font-size:.62rem;font-family:var(--mono);color:var(--muted);white-space:nowrap}
.prog{display:flex;gap:3px}
.prog i{height:6px;flex:1;border-radius:3px;background:var(--sunk)}
.prog i.on{background:var(--accent)}

/* ajustes */
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field select{border:1px solid var(--field);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px;font:inherit;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cardline{display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:end}
.iconbtn{border:0;background:var(--sunk);border-radius:10px;width:44px;height:44px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.72rem;color:var(--muted);font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* hoja */
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92%;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{flex:1}
.thumb{max-height:160px;border-radius:10px;object-fit:cover;width:100%}
.busy{display:flex;align-items:center;gap:10px;color:var(--muted)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.note{font-size:.8rem;color:var(--muted)}

/* plan: el sobre del mes */
.envelope{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.envelope.neg{background:var(--bad)}
.envelope .label{color:inherit;opacity:.8}
.envelope .big{font-family:var(--display);font-weight:800;font-size:2.3rem;line-height:1.05;font-variant-numeric:tabular-nums}
.envelope .split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.envelope .split div{background:rgb(255 255 255 / .14);border-radius:10px;padding:8px 10px;min-width:0}
.envelope .split b{display:block;font-family:var(--mono);font-size:1.05rem;overflow-wrap:anywhere}
.envelope .split small{opacity:.85}
.envelope .weekbar{height:8px;border-radius:8px;background:rgb(255 255 255 / .22);overflow:hidden}
.envelope .weekbar i{display:block;height:100%;background:currentColor;border-radius:8px}
.envelope button{background:rgb(255 255 255 / .18);color:inherit;border:0;border-radius:8px;padding:6px 10px;font-weight:600}
.envelope input{border:0;border-radius:10px;padding:11px;font:inherit;min-width:0;flex:1;background:var(--surface);color:var(--ink)}
.ledger{display:flex;flex-direction:column}
.ledger .ln{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.ledger .ln:first-child{border-top:0}
.ledger .ln.total{border-top:2px solid var(--ink);font-weight:700}
.ledger .ln span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.check{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">bolsi<span>llo</span></div>
    <div class="monthnav">
      <button id="prevM" aria-label="Mes anterior">‹</button>
      <b id="monthLbl"></b>
      <button id="nextM" aria-label="Mes siguiente">›</button>
    </div>
  </header>

  <form class="quick" id="quickForm" autocomplete="off">
    <div class="qrow">
      <input id="quickIn" placeholder="gasté 5 lucas en el súper" aria-label="Escribí un gasto o ingreso">
      <button class="btn ghost" type="button" id="micBtn" aria-label="Dictar por voz" title="Dictar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
      </button>
      <button class="btn ghost" type="button" id="camBtn" aria-label="Sacar foto a una factura" title="Foto de factura">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <button class="btn primary" type="submit">Anotar</button>
    </div>
    <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
    <input type="file" id="fileIn" accept="image/*,application/pdf,.pdf" hidden>
    <div class="chips" id="hints">
      <button type="button" class="chip">gasté 12 lucas en el súper</button>
      <button type="button" class="chip">cobré el sueldo, 850 lucas</button>
      <button type="button" class="chip">zapatillas 180 lucas en 6 cuotas con visa</button>
      <button type="button" class="chip">spotify 200 lucas por mes con visa</button>
      <button type="button" class="chip">netflix 10 dólares</button>
    </div>
    <div id="toast" hidden></div>
  </form>

  <main id="view"></main>
  <p class="note" id="storeNote" hidden></p>
</div>

<nav class="tabs" aria-label="Secciones"><div class="in">
  <button data-tab="inicio" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-6 8 6v8H4z"/></svg>Inicio</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M8 14h3M8 17h6"/></svg>Plan</button>
  <button data-tab="cuotas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Cuotas</button>
  <button data-tab="presupuestos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19V9M12 19V5M19 19v-7"/></svg>Límites</button>
  <button data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>Ajustes</button>
</div></nav>

<div id="sheetRoot"></div>

<script>
(() => {
/* ---------- constantes ---------- */
const CATS = {
  super:{n:"Súper",c:"#1E7A58"}, comida:{n:"Comida y delivery",c:"#D9822B"}, transporte:{n:"Transporte",c:"#2D58A8"},
  servicios:{n:"Servicios",c:"#7A5AB5"}, suscripciones:{n:"Suscripciones",c:"#C2417A"}, salud:{n:"Salud",c:"#2B9AA0"},
  ropa:{n:"Ropa",c:"#A86A3D"}, ocio:{n:"Salidas y ocio",c:"#C9A227"}, hogar:{n:"Casa",c:"#5E7D4E"},
  tecno:{n:"Tecnología",c:"#4A6D8C"}, mascotas:{n:"Mascotas",c:"#8C6B4A"}, otros:{n:"Otros",c:"#7D8A83"},
  sueldo:{n:"Sueldo",c:"#1E7A58"}, extra:{n:"Ingreso extra",c:"#3F9C6E"}
};
const BASE_GASTO = ["super","comida","transporte","servicios","suscripciones","salud","ropa","ocio","hogar","tecno","mascotas","otros"];
const GASTO_CATS = BASE_GASTO.slice();
const CUSTOM_COLORS=["#B5523B","#3E7CB1","#8E6CC2","#2E8B57","#C17C2E","#B0417E","#4F8F8F","#7A6A3A"];
function syncCats(){
  const s=state.settings; s.customCats=s.customCats||[]; s.subcats=s.subcats||{}; s.learnedSub=s.learnedSub||{}; s.goals=s.goals||[];
  for(const k of Object.keys(CATS)) if(CATS[k].custom) delete CATS[k];
  s.customCats.forEach(c=>{ CATS[c.id]={n:c.n,c:c.c,custom:true}; });
  GASTO_CATS.length=0; GASTO_CATS.push(...BASE_GASTO.filter(c=>c!=="otros"), ...s.customCats.map(c=>c.id), "otros");
}
function norm(x){ return String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function hasWord(t,w){ w=norm(w).trim(); if(!w) return false; return new RegExp("(^|[^a-z0-9])"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?=$|[^a-z0-9])").test(t); }
function guessSub(text,cat){
  const t=norm(text); const subs=(state.settings.subcats||{})[cat]||[];
  for(const x of subs) if(hasWord(t,x)) return x;
  const L=state.settings.learnedSub||{};
  for(const w of t.split(/[^a-z0-9]+/)){ const v=L[w]; if(v && v.cat===cat && subs.includes(v.sub)) return v.sub; }
  return null;
}
function catLabel(e){ return (CATS[e.cat]?.n||"")+(e.sub?" › "+e.sub:""); }
const INGRESO_CATS = ["sueldo","extra"];
const KW = {
  super:["super","súper","supermercado","carrefour","coto","dia","día","jumbo","disco","chino","almacen","almacén","verduleria","verdulería","carniceria","carnicería","vea","changomas"],
  comida:["delivery","rappi","pedidosya","pedidos ya","pizza","empanadas","cafe","café","almuerzo","cena","restaurant","resto","mc","burger","helado","birra","cerveza","bar","comida","starbucks"],
  transporte:["uber","cabify","didi","sube","colectivo","bondi","subte","taxi","nafta","ypf","shell","axion","peaje","estacionamiento","tren","remis"],
  servicios:["luz","edenor","edesur","gas","metrogas","agua","aysa","internet","fibertel","telecentro","celular","personal","claro","movistar","expensas","alquiler","abl","seguro"],
  suscripciones:["netflix","spotify","disney","hbo","max","prime","youtube","chatgpt","gemini","claude","icloud","xbox","playstation","suscripcion","suscripción","crunchyroll","twitch"],
  salud:["farmacia","farmacity","medico","médico","dentista","prepaga","osde","swiss","galeno","remedio","gym","gimnasio"],
  ropa:["ropa","zapatillas","remera","jean","campera","buzo","nike","adidas","zara","perfume","fragancia"],
  ocio:["cine","juego","steam","entrada","recital","boliche","salida","wild rift","skin","riot"],
  hogar:["ferreteria","ferretería","mueble","easy","sodimac","limpieza","casa"],

const ING_RX = /(^|[\s,.])(cobr[eé]|me pagaron|me pag[oó]|sueldo|aguinaldo|ingres[oó]|ingreso|vend[ií]|me transfirieron|propina|cobro|recib[ií])(?=$|[\s,.!?])/i;
const USD_RX = /(u\$s|us\$|usd|d[oó]lar(es)?|verdes?|lechugas?)/i;
const FIJO_RX = /(todos los meses|por mes|cada mes|al mes|x mes|mensual(es)?|mensualmente|fijo)/i;
const NUMW = {un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,
  dieciseis:16,"dieciséis":16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiun:21,veintiuno:21,veintidos:22,"veintidós":22,veintitres:23,"veintitrés":23,veinticuatro:24,veinticinco:25,
  veintiseis:26,"veintiséis":26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,
  cien:100,ciento:100,doscientos:200,doscientas:200,trescientos:300,trescientas:300,cuatrocientos:400,cuatrocientas:400,quinientos:500,quinientas:500,
  seiscientos:600,seiscientas:600,setecientos:700,setecientas:700,ochocientos:800,ochocientas:800,novecientos:900,novecientas:900,medio:0.5,media:0.5};
// "dos millones trescientos mil" -> "2300000", "cinco lucas" -> "5 lucas" (para lo que se dicta por voz)
function wordsToDigits(text){
  const toks = text.split(/(\s+)/); const out=[]; let i=0;
  const isNum = w => w in NUMW || w==="mil" || /^mill[oó]n(es)?$/.test(w);
  const UNIT = /^(lucas?|palos?|d[oó]lares?|mangos?|verdes?|pesos?|mil|mill[oó]n(es)?)$/;
  while(i<toks.length){
    const w=toks[i].toLowerCase();
    if(!/\s/.test(toks[i]) && isNum(w)){
      let j=i, seq=[];
      while(j<toks.length){
        const x=toks[j].toLowerCase();
        if(/\s/.test(toks[j])){ j++; continue; }
        if(isNum(x)){ seq.push(x); j++; continue; }
        if(x==="y" && seq.length){ const nx=(toks[j+2]||"").toLowerCase(); if(nx in NUMW){ j++; continue; } }
        break;
      }
      // "15 mil" o "2 millones": el número ya está en cifras, la unidad la resuelve parseAmount
      const prevTok=(out.slice().reverse().find(t=>!/^\s*$/.test(t))||"").trim();
      let startCur=0;
      if(/^(mil|mill[oó]n(es)?)$/.test(seq[0]) && /^\d+([.,]\d+)?$/.test(prevTok)){
        if(seq.length===1){ out.push(toks[i]); i++; continue; }
        // "2 mil quinientos": junto la cifra con las palabras
        for(let k=out.length-1;k>=0;k--){ if(out[k].trim()){ out.splice(k,1); break; } }
        startCur=num(prevTok);
      }
      // "un/una/medio" solos solo cuentan si los sigue una unidad (un palo, una luca, medio palo)
      const next=(toks.slice(j).find(t=>!/\s/.test(t))||"").toLowerCase();
      if(seq.length===1 && ["un","uno","una","medio","media"].includes(seq[0]) && !UNIT.test(next)){ out.push(toks[i]); i++; continue; }
      let total=0, cur=startCur, lastMult=1;
      seq.forEach((x,k)=>{
        if(x==="mil"){ total += (cur||1)*1000; cur=0; lastMult=1000; }
        else if(/^mill/.test(x)){ total = (total+(cur||1))*1e6; cur=0; lastMult=1e6; }
        else if((x==="medio"||x==="media") && k>0 && lastMult>1){ total += lastMult/2; }
        else cur += NUMW[x];
      });
      out.push(String(total+cur)+" ");
      i=j; continue;
    }
    out.push(toks[i]); i++;
  }
  return out.join("").replace(/\s+/g," ");
}

function monthKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function addMonths(k,n){ const [y,m]=k.split("-").map(Number); const d=new Date(y,m-1+n,1); return monthKey(d); }
function monthName(k,long){ const [y,m]=k.split("-").map(Number); const nm=new Date(y,m-1,1).toLocaleDateString("es-AR",{month:long?"long":"short"}); return long? nm+" "+y : nm.replace(".",""); }
function monthDiff(a,b){ const [ya,ma]=a.split("-").map(Number),[yb,mb]=b.split("-").map(Number); return (yb-ya)*12+(mb-ma); }
const fmtN = (n,d=0)=> Number(n||0).toLocaleString("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d});
function money(n,cur){ const neg=n<0; const a=Math.abs(n); const s = cur==="USD" ? "US$ "+fmtN(a, a<100 && a%1?2:0) : "$ "+fmtN(a); return (neg?"−":"")+s; }
function toView(amount,cur){ const r=+state.settings.rate||1; const v=state.settings.view; if(cur===v) return amount; return v==="ARS"? amount*r : amount/r; }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function cap(s){ s=String(s||"").trim(); return s? s[0].toUpperCase()+s.slice(1):s; }
function statementMonth(dateISO,cardName){
  const card = state.settings.cards.find(c=>c.n===cardName) || {cierre:25};
  const d = new Date(dateISO+"T12:00:00");

/* ---------- parser de lenguaje criollo ---------- */
function parseAmount(text){
  const t = text.toLowerCase().replace(/\$/g," ");
  const palosVerdes = t.match(/(\d+(?:[.,]\d+)?)\s*palos?\s+verdes?/);
  if(palosVerdes) return {amount: num(palosVerdes[1])*1000, forceUSD:true, raw:palosVerdes[0]};
  if(/(^|\s)un palo verde(\s|$)/.test(t)) return {amount:1000, forceUSD:true, raw:"un palo verde"};
  const rx = /(\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+(?:[.,]\d+)?)\s*(lucas?|luquitas?|k|mil|palos?|millones?|mill[oó]n|m(?![a-záéíóú])|mangos?)?(\s+y\s+medi[oa])?/g;
  let m, best=null;
  while((m=rx.exec(t))){
    // ignorar el número de cuotas
    const after = t.slice(m.index+m[0].length, m.index+m[0].length+8);
    if(/^\s*cuotas?/.test(after) && !m[2]) continue;
    let v = num(m[1]); const u=(m[2]||"").trim(); let mult=1;
    if(/^(lucas?|luquitas?|k|mil)$/.test(u)) mult=1000;
    else if(/^(palos?|millones?|mill[oó]n|m)$/.test(u)) mult=1e6;
    v*=mult;
    if(m[3] && mult>1) v += mult/2;          // "una luca y media", "un palo y medio"
    if(!best || v>best.amount) best={amount:v, raw:m[0], index:m.index};
  }
  return best;
}

/* fechas habladas: "ayer", "anteayer", "el viernes", "el 20", "20/10" */
const DIAS = {domingo:0,lunes:1,martes:2,"miércoles":3,miercoles:3,jueves:4,viernes:5,"sábado":6,sabado:6};
function isoOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseDate(text){
  const t=" "+text.toLowerCase()+" "; const now=new Date(); now.setHours(12,0,0,0);
  const back = n => { const d=new Date(now); d.setDate(d.getDate()-n); return d; };
  let m;
  if((m=t.match(/\s(anteayer|antes de ayer|antier)(?=[\s,.!?])/))) return {date:isoOf(back(2)), raw:m[1]};
  if((m=t.match(/\s(ayer)(?=[\s,.!?])/))) return {date:isoOf(back(1)), raw:m[1]};
  if((m=t.match(/\s((?:el\s+)?(domingo|lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado)(?:\s+pasado)?)(?=[\s,.!?])/))){
    const target=DIAS[m[2]] ?? DIAS[m[2].normalize("NFD").replace(/[̀-ͯ]/g,"")];
    const diff=(now.getDay()-target+7)%7; return {date:isoOf(back(diff)), raw:m[1]};
  }
  if((m=t.match(/\s((\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?)(?=[\s,.!?])/))){
    const dd=+m[2], mm=+m[3]; let yy=m[4]? +m[4] : now.getFullYear(); if(yy<100) yy+=2000;
    if(dd>=1&&dd<=31&&mm>=1&&mm<=12){ let d=new Date(yy,mm-1,dd,12); if(!m[4] && d>now) d=new Date(yy-1,mm-1,dd,12); return {date:isoOf(d), raw:m[1]}; }
  }
  if((m=t.match(/\s(el\s+(?:d[ií]a\s+)?(\d{1,2}))(?!\s*(?:[.,]\d|lucas?|luquitas?|k\b|mil|palos?|mill|pesos?|mangos?|d[oó]lar|verdes?|cuotas?|%))(?=[\s,.!?])/))){
    const dd=+m[2];
    if(dd>=1&&dd<=31){ let d=new Date(now.getFullYear(),now.getMonth(),dd,12); if(d>now) d=new Date(now.getFullYear(),now.getMonth()-1,dd,12); return {date:isoOf(d), raw:m[1]}; }
  }
  return null;
}
function num(s){
  s=String(s);
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) return parseFloat(s.replace(/\./g,"").replace(",","."));
  if(/,/.test(s)) return parseFloat(s.replace(",","."));
  return parseFloat(s);
}
function guessCat(text, tipo){
  const t=" "+text.toLowerCase()+" ";
  if(tipo==="ingreso") return /sueldo|aguinaldo/.test(t)?"sueldo":"extra";
  const tn=norm(text);
  for(const [cat,subs] of Object.entries(state.settings.subcats||{})){ if(!GASTO_CATS.includes(cat)) continue; for(const x of subs) if(hasWord(tn,x)) return cat; }
  for(const c of (state.settings.customCats||[])) if(hasWord(tn,c.n)) return c.id;
  for(const w of t.split(/[^a-záéíóúñü0-9]+/)){ if(w.length>3 && state.settings.learned[w] && GASTO_CATS.includes(state.settings.learned[w])) return state.settings.learned[w]; }
  for(const [cat,list] of Object.entries(KW)){ for(const k of list){ if(new RegExp("[^a-záéíóúñ]"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[^a-záéíóúñ]").test(t)) return cat; } }
  return "otros";
}
const CADA_RX = /(cada un[oa]|c\/u|cada cuota|por cuota|por mes cada)/i;
function parseLocal(text){
  text = wordsToDigits(text);
  const dt = parseDate(text);
  if(dt) text = text.replace(new RegExp(dt.raw.replace(/[.*+?^${}()|[\]\\/]/g,"\\$&"),"i")," ").replace(/\s+/g," ").trim();
  const a = parseAmount(text); if(!a || !(a.amount>0)) return null;
  const fijo = !ING_RX.test(text) && FIJO_RX.test(text);
  const tipo = ING_RX.test(text) ? "ingreso" : "gasto";
  const currency = (a.forceUSD || USD_RX.test(text)) ? "USD" : "ARS";
  const low = text.toLowerCase().replace(/\$/g," ");
  const cm = low.match(/(\d+)\s*cuotas?/);
  const cuotas = tipo==="gasto" && cm ? Math.max(1,parseInt(cm[1],10)) : 1;
  let amount = a.amount;
  // "3 cuotas de 20 lucas" o "... cada una" con cuotas: el monto es por cuota
  const before = low.slice(Math.max(0,(a.index??0)-24), a.index??0);
  if(cuotas>1 && !fijo && (/cuotas?\s+de\s*$/.test(before) || CADA_RX.test(low))) amount = a.amount*cuotas;
  // "2 remeras a 15 mil cada una": multiplica por la cantidad
  else if(cuotas===1 && CADA_RX.test(low)){
    const rest = low.slice(0,a.index??0) + " " + low.slice((a.index??0)+a.raw.length);
    const q = rest.match(/(^|\s)(\d{1,2})(?=\s+[a-záéíóúñ])/);
    if(q && +q[2]>=2) amount = a.amount * (+q[2]);
  }
  let card = null;
  for(const c of state.settings.cards){ const w=c.n.split(" ")[0].toLowerCase(); if(new RegExp("(^|\\s)"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?=$|[\\s,.!?])","i").test(low)) card=c.n; }
  if(cuotas>1 && !card) card = state.settings.defCard;
  const STOP = new Set(["gasté","gaste","pagué","pague","compré","compre","cobré","cobre","me","pagaron","en","de","del","el","la","los","las","un","una","uno","con","por","pesos","peso","mangos","mango","dólares","dolares","dólar","dolar","usd","u$s","us$","verde","verdes","lucas","luca","cuota","cuotas","y","al","a","mi","para","hoy","ayer","palo","palos","todos","meses","mes","cada","c/u","x","mensual","mensuales","mensualmente","fijo","millones","millón","millon","mil","medio","media"]);
  if(card) STOP.add(card.toLowerCase().split(" ")[0]);
  let desc = low.replace(a.raw.trim()," ").replace(/\d+\s*cuotas?/gi," ")
    .split(/[\s,.;:!?]+/).filter(w=>w && !STOP.has(w) && !/^\d+([.,]\d+)?k?$/.test(w)).join(" ").trim();
  if(!desc) desc = tipo==="ingreso" ? "Ingreso" : "Gasto";
  desc = cap(desc).slice(0,80);
  const cat=guessCat(text,tipo);
  return { tipo, amount, currency, cat, sub: tipo==="gasto"?guessSub(text,cat):null, desc, cuotas: fijo?1:cuotas, card, fijo, date: dt?dt.date:null };
}

async function compressImage(file){
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  const max=1600, s=Math.min(1, max/Math.max(img.width,img.height));
  const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  const blob = await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
  return {blob, url:c.toDataURL("image/jpeg",0.5)};
}

async function geminiJSON(prompt, opts={}){
  const g=gLoad(); if(!g.key) throw {code:"no_key"};

  for(const b of (opts.images||[])) parts.push({inline_data:{mime_type:b.type||"image/jpeg", data: await blobToBase64(b)}});
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(g.model||DEFAULT_MODEL)}:generateContent`;
  let res;
  try{ res = await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":g.key},body:JSON.stringify({contents:[{role:"user",parts}],generationConfig:{responseMimeType:"application/json",temperature:0.1}})}); }
  catch(e){ throw {code:"offline"}; }
  if(res.status===429) throw {code:"rate_limited"};

  try{ return JSON.parse(txt); }catch(e){ throw {code:"invalid_json"}; }

function buildItem(p, dateISO, existingId){
  const date = dateISO || todayISO(); const sub = p.tipo==="gasto" ? (p.sub||null) : null;
  if(p.tipo==="gasto" && p.fijo){
    return { id:existingId||uid("f_"), kind:"fijo", tipo:"gasto", amount:p.amount, currency:p.currency, cat:p.cat, sub, desc:p.desc, date, day:+date.slice(8,10), start: date.slice(0,7), until:p.until||null, card:p.card||null };
  }
  if(p.tipo==="gasto" && p.cuotas>1){
    const card = p.card || state.settings.defCard;
    return { id:existingId||uid("c_"), kind:"cuota", tipo:"gasto", total:p.amount, cuotas:p.cuotas, currency:p.currency, cat:p.cat, sub, desc:p.desc, date, card, first: statementMonth(date,card) };
  }
  return { id:existingId||uid("m_"), kind:"mov", tipo:p.tipo, amount:p.amount, currency:p.currency, cat:p.cat, sub, desc:p.desc, date, card:p.card||null };
}
// entradas del mes elegido (cuotas aparecen en el mes de su resumen)
function entriesFor(month){
  const out=[];
  for(const it of state.items){
    if(it.kind==="mov" && it.date && it.date.slice(0,7)===month) out.push({...it, view: toView(it.amount,it.currency)});
    if(it.kind==="cuota"){ const n=monthDiff(it.first,month); if(n>=0 && n<it.cuotas){ const per=it.total/it.cuotas; out.push({...it, n:n+1, amount:per, view:toView(per,it.currency)}); } }
    if(it.kind==="fijo" && fijoActive(it,month)){ out.push({...it, date: month+"-"+String(Math.min(it.day||1,daysIn(month))).padStart(2,"0"), view:toView(it.amount,it.currency)}); }
  }
  return out.sort((a,b)=> (b.date||"").localeCompare(a.date||"") );
}
function fijoActive(it,month){ return monthDiff(it.start,month)>=0 && (!it.until || monthDiff(month,it.until)>=0); }
function daysIn(month){ const [y,m]=month.split("-").map(Number); return new Date(y,m,0).getDate(); }

/* ---------- metas de ahorro ---------- */
function goalSaved(g, beforeMonth){ return (g.aportes||[]).filter(a=>!beforeMonth || a.date.slice(0,7)<beforeMonth).reduce((t,a)=>t+a.amount,0); }
// cuánto conviene guardar ese mes: estable dentro del mes (no cuenta lo aportado este mes)
function goalMonthly(g, month){
  if(!g.deadline || !(g.target>0) || monthDiff(month,g.deadline)<0) return 0;
  const cur=monthKey(new Date()); const base = monthDiff(cur,month)>0 ? cur : month;
  const left = monthDiff(base,g.deadline)+1; if(left<=0) return 0;
  const saved=goalSaved(g,base); if(saved>=g.target) return 0;
  return (g.target-saved)/left;
}
function parseMoneyInput(v){ const pa=parseAmount(wordsToDigits(String(v||""))); return pa? pa.amount : 0; }
function addAporte(g, amount, date){ g.aportes=g.aportes||[]; const a={id:uid("a_"),date:date||todayISO(),amount}; g.aportes.push(a); saveSettings(); return a; }
function matchGoalAporte(text){
  const t=norm(text); if(!/(^|\s)(guarde|ahorre|aparte|puse|meti|sume|deposite)(?=\s|$)/.test(t)) return null;
  const g=(state.settings.goals||[]).find(x=>hasWord(t,x.name)); if(!g) return null;
  const a=parseAmount(wordsToDigits(text)); if(!a||!(a.amount>0)) return null;
  const dt=parseDate(text); return {g, amount:a.amount, date: dt?dt.date:todayISO()};
}

/* ---------- presupuestos automáticos ---------- */
function avgSpend(month){
  const r=+state.settings.rate||1; const sums={}; let months=0;
  for(let i=1;i<=3;i++){ const E=entriesFor(addMonths(month,-i)).filter(e=>e.tipo==="gasto"); if(E.length) months++; E.forEach(e=>{ sums[e.cat]=(sums[e.cat]||0)+(e.currency==="USD"?e.amount*r:e.amount); }); }
  const avg={}; if(months) for(const [c,v] of Object.entries(sums)) avg[c]=Math.ceil(v/months/1000)*1000;
  return {avg, months};
}
function budgetsFor(month){
  const manual={...(state.settings.budgets||{})};
  if(!state.settings.autoBudgets) return manual;
  return {...avgSpend(month).avg, ...manual};
}

function exportCSV(){

  const n=x=> String(Math.round(x*100)/100).replace(".",",");

  const rows=state.items.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(it=>{ const amt=it.kind==="cuota"?it.total:it.amount;
    return [it.date, it.tipo==="ingreso"?"Ingreso":"Gasto", it.kind==="cuota"?"En cuotas":it.kind==="fijo"?"Fijo mensual":"Movimiento", it.desc, CATS[it.cat]?.n||it.cat, it.sub||"", n(amt), it.currency, it.kind==="cuota"?it.cuotas:"", it.kind==="cuota"?n(it.total/it.cuotas):"", it.card||"", it.kind==="fijo"&&it.until?it.until:""]; });
  download(`bolsillo-movimientos-${todayISO()}.csv`, "\ufeff"+[head,...rows].map(r=>r.map(f).join(";")).join("\r\n"), "text/csv;charset=utf-8");
}
function backupDue(){

}

/* ---------- el plan: cuánto podés gastar para vivir ---------- */
function planFor(month){
  const E = entriesFor(month);
  const inc = state.settings.income||{amount:0,currency:"ARS"};
  const expected = inc.amount>0 ? toView(inc.amount,inc.currency) : 0;
  const cobrado = E.filter(e=>e.tipo==="ingreso").reduce((s,e)=>s+e.view,0);
  const ingreso = Math.max(expected, cobrado);
  const fijos = E.filter(e=>e.kind==="fijo").reduce((s,e)=>s+e.view,0);
  const cuotas = E.filter(e=>e.kind==="cuota").reduce((s,e)=>s+e.view,0);
  const variables = E.filter(e=>e.kind==="mov" && e.tipo==="gasto").reduce((s,e)=>s+e.view,0);
  const metas = (state.settings.goals||[]).reduce((t,g)=>t+toView(goalMonthly(g,month),g.currency),0);
  const paraVivir = ingreso - fijos - cuotas - metas;
  const queda = paraVivir - variables;
  const dim = daysIn(month); const now=new Date(); const cur=monthKey(now);
  const d = monthDiff(cur,month);
  const daysLeft = d<0 ? 0 : d>0 ? dim : dim - now.getDate() + 1;
  const perDay = daysLeft>0 ? queda/daysLeft : 0;
  const weekBudget = paraVivir/(dim/7);
  // semana actual (lunes a domingo), solo gastos del día a día
  let weekSpent=0, weekLabel="";
  if(d===0){
    const dow=(now.getDay()+6)%7; const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow); const sun=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6);
    const iso=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
    const a=iso(mon), b=iso(sun);
    weekSpent = E.filter(e=>e.kind==="mov"&&e.tipo==="gasto"&&e.date>=a&&e.date<=b).reduce((s,e)=>s+e.view,0);
    weekLabel = `${mon.getDate()} al ${sun.getDate()} de ${sun.toLocaleDateString("es-AR",{month:"long"})}`;
  }
  return {ingreso, expected, cobrado, fijos, cuotas, metas, variables, paraVivir, queda, daysLeft, perDay, perWeek: perDay*7, weekBudget, weekSpent, weekLabel, dim, d};
}
function envelopeHTML(month){
  const v=state.settings.view; const P=planFor(month);
  if(!(P.ingreso>0)){
    return `<div class="envelope"><span class="label">Tu plata para vivir</span>
      <div style="font-size:1.05rem;font-weight:600">¿Cuánto cobrás por mes? Con eso te digo cuánto podés gastar por semana.</div>
      <form class="qrow" id="incForm"><input id="incIn" class="num" inputmode="decimal" placeholder="Ej: 2.000.000" aria-label="Sueldo mensual en pesos"><button type="submit">Listo</button></form></div>`;
  }
  const neg = P.queda<0;
  const titleMonth = P.d===0 ? "Te queda para vivir este mes" : P.d>0 ? `Para vivir en ${monthName(month,true)}` : `Te sobró en ${monthName(month,true)}`;
  const wp = P.weekBudget>0 ? Math.min(100, P.weekSpent/P.weekBudget*100) : 0;
  return `<div class="envelope ${neg?"neg":""}">
    <span class="label">${titleMonth}</span>

    ${P.daysLeft>0 && !neg ? `<div class="split">

    ${P.d===0 ? `<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;gap:8px;font-size:.85rem"><span>Semana del ${esc(P.weekLabel)}</span><span class="num">${money(P.weekSpent,v)} de ${money(P.weekBudget,v)}</span></div><div class="weekbar"><i style="width:${wp}%"></i></div></div>`:""}
    <div><button type="button" data-go="plan">Ver el plan completo</button></div>
  </div>`;
}

  const line = sv>=g.target ? "¡Meta cumplida!" : g.deadline ? (left>0? `Faltan ${money(falta,g.currency)}. Guardá ${money(per,g.currency)} por mes hasta ${monthName(g.deadline,true)}.` : `Se pasó la fecha (${monthName(g.deadline,true)}). Faltan ${money(falta,g.currency)}.`) : `Faltan ${money(falta,g.currency)}. Sin fecha límite.`;
  return `<div class="goal">

    cardDelPending=null; state.items.forEach(it=>{ if(it.card===name) it.card=dest; });

  q("#gTestBtn").onclick=async()=>{ gSave({key:q("#gKey").value.trim(), model:q("#gModel").value.trim()||DEFAULT_MODEL}); say(gMsg,"Probando…");

    catch(e){ say(gMsg, ({no_key:"Pegá la clave primero.",bad_key:"Google rechazó la clave. Copiala de nuevo, completa.",bad_model:"Ese modelo no existe. Probá con gemini-flash-latest.",rate_limited:"Límite gratis alcanzado por ahora. Probá en un rato.",offline:"Sin conexión a internet."})[e.code]||"No funcionó. Revisá la clave y la conexión."); } };

  q("#csvBtn").onclick=()=>{ exportCSV(); showToast("Planilla descargada. Abrila con Excel o Google Sheets."); };

      Object.assign(state.settings, d.settings||{}); syncCats(); lsSave(); render(); showToast(`Copia restaurada: ${n} movimientos nuevos.`);

  $view.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{ s.theme=b.dataset.th; saveSettings(); });
  q("#catSel").onchange=e=>{ state.ui.catSel=e.target.value; render(); };
  q("#subForm").onsubmit=e=>{ e.preventDefault(); const name=cap(q("#subIn").value.trim()).slice(0,24); if(!name) return;
    const list=(s.subcats[sel]=s.subcats[sel]||[]); if(list.some(x=>norm(x)===norm(name))){ showToast("Esa subcategoría ya existe."); return; }
    list.push(name); saveSettings(); showToast(`Subcategoría ${esc(name)} agregada a ${esc(CATS[sel].n)}.`); };
  $view.querySelectorAll("[data-subdel]").forEach(b=>b.onclick=()=>{ const list=s.subcats[sel]||[]; const name=list[+b.dataset.subdel]; list.splice(+b.dataset.subdel,1);
    state.items.forEach(it=>{ if(it.cat===sel&&it.sub===name) it.sub=null; }); lsSave(); saveSettings(); showToast(`Quitada. Esos movimientos quedan en ${esc(CATS[sel].n)}.`); });
  q("#catForm").onsubmit=e=>{ e.preventDefault(); const name=cap(q("#catIn").value.trim()).slice(0,24); if(!name) return;
    if(Object.values(CATS).some(c=>norm(c.n)===norm(name))){ showToast("Ya hay una categoría con ese nombre."); return; }
    const id=uid("k_"); s.customCats.push({id,n:name,c:CUSTOM_COLORS[s.customCats.length%CUSTOM_COLORS.length]}); syncCats(); state.ui.catSel=id; saveSettings(); showToast(`Categoría ${esc(name)} creada.`); };
  $view.querySelectorAll("[data-catdel]").forEach(b=>b.onclick=()=>{ const id=b.dataset.catdel; const c=s.customCats.find(x=>x.id===id); if(!c) return;
    const uses=state.items.filter(it=>it.cat===id).length;
    if(uses && state.ui.catDelPending!==id){ state.ui.catDelPending=id; showToast(`${esc(c.n)} tiene ${uses} ${uses===1?"movimiento":"movimientos"}. Tocá ✕ de nuevo y pasan a Otros.`); return; }
    state.ui.catDelPending=null; state.items.forEach(it=>{ if(it.cat===id){ it.cat="otros"; it.sub=null; } });
    s.customCats=s.customCats.filter(x=>x.id!==id); delete s.subcats[id]; delete s.budgets[id];
    for(const [w,v] of Object.entries(s.learned)) if(v===id) delete s.learned[w];
    for(const [w,v] of Object.entries(s.learnedSub||{})) if(v.cat===id) delete s.learnedSub[w];
    if(state.ui.catSel===id) state.ui.catSel="comida"; syncCats(); lsSave(); saveSettings(); showToast(`Categoría ${esc(c.n)} quitada.`); });
  $view.querySelectorAll("[data-snap]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.snap;
    if(state.ui.snapPending!==i){ state.ui.snapPending=i; render(); return; }
    state.ui.snapPending=null; const sn=loadSnaps()[i]; if(!sn) return;
    pushSnap("antes de restaurar");
    state.items=JSON.parse(JSON.stringify(sn.items)); Object.assign(state.settings, JSON.parse(JSON.stringify(sn.settings))); syncCats(); lsSave(); render();
    showToast(`Volviste a la copia del ${fecha(sn.at)}. Lo que tenías recién quedó guardado por las dudas.`); });
  q("#tutBtn").onclick=()=>showTutorial(0);
}

/* ---------- formulario (hoja) ---------- */
function fromItem(it){
  if(it.kind==="fijo") return {tipo:"gasto",amount:it.amount,currency:it.currency,cat:it.cat,sub:it.sub||null,desc:it.desc,cuotas:1,card:it.card,date:it.date,fijo:true};
  return it.kind==="cuota" ? {tipo:"gasto",amount:it.total,currency:it.currency,cat:it.cat,sub:it.sub||null,desc:it.desc,cuotas:it.cuotas,card:it.card,date:it.date} : {tipo:it.tipo,amount:it.amount,currency:it.currency,cat:it.cat,sub:it.sub||null,desc:it.desc,cuotas:1,card:it.card,date:it.date}; }
function openForm(p, existing, photoURL){
  const root=document.getElementById("sheetRoot");
  const f={...p, date:p.date||todayISO()};
  let confirmDel=false;
  const draw=()=>{
    const cats = f.tipo==="ingreso"? INGRESO_CATS : GASTO_CATS;
    if(!cats.includes(f.cat)) f.cat=cats[0];
    root.innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sform" role="dialog" aria-label="Movimiento">
      <div class="sechead"><h2>${existing?"Editar":"Revisá y guardá"}</h2><button type="button" class="chip" id="sclose">Cerrar</button></div>
      ${photoURL && photoURL.startsWith("data:") ?`<img class="thumb" src="${photoURL}" alt="Foto de la factura">`: photoURL ? `<div class="check"><b>PDF</b><span class="muted" style="overflow-wrap:anywhere">${esc(photoURL)}</span></div>`:""}
      <div class="seg" role="group"><button type="button" data-t="gasto" aria-pressed="${f.tipo==="gasto"}">Gasto</button><button type="button" data-t="ingreso" aria-pressed="${f.tipo==="ingreso"}">Ingreso</button></div>
      <div class="grid2">
        <div class="field"><label for="fAmt">${f.cuotas>1?"Total de la compra":"Monto"}</label><input id="fAmt" class="num" inputmode="decimal" value="${f.amount===""?"":f.amount}" required></div>
        <div class="field"><label for="fCur">Moneda</label><select id="fCur"><option value="ARS" ${f.currency==="ARS"?"selected":""}>Pesos</option><option value="USD" ${f.currency==="USD"?"selected":""}>Dólares</option></select></div>
      </div>
      <div class="field"><label for="fDesc">Descripción</label><input id="fDesc" maxlength="80" value="${esc(f.desc)}" placeholder="Ej: Carrefour"></div>
      <div class="grid2">
        <div class="field"><label for="fCat">Categoría</label><select id="fCat">${cats.map(c=>`<option value="${c}" ${c===f.cat?"selected":""}>${esc(CATS[c].n)}</option>`).join("")}</select></div>
        <div class="field"><label for="fDate">Fecha</label><input id="fDate" type="date" value="${f.date}"></div>
      </div>
      ${f.tipo==="gasto" && (state.settings.subcats[f.cat]||[]).length?`<div class="field"><label for="fSub">Subcategoría</label><select id="fSub"><option value="">Sin subcategoría</option>${state.settings.subcats[f.cat].map(x=>`<option ${x===f.sub?"selected":""}>${esc(x)}</option>`).join("")}</select></div>`:""}
      ${f.tipo==="gasto"?`<label class="check" for="fFijo"><input type="checkbox" id="fFijo" ${f.fijo?"checked":""}><span><b>Se repite todos los meses</b><br><small class="muted">Alquiler, suscripción, servicio. Se resta solo de tu sueldo.</small></span></label>`:""}
      ${f.tipo==="gasto" && f.fijo?`<div class="field"><label for="fCard">Se paga con</label><select id="fCard"><option value="">Efectivo / débito / transferencia</option>${state.settings.cards.map(c=>`<option ${c.n===f.card?"selected":""}>${esc(c.n)}</option>`).join("")}</select></div>`:""}
      ${f.tipo==="gasto" && !f.fijo?`<div class="grid2">
        <div class="field"><label for="fCuo">Cuotas</label><select id="fCuo">${[1,2,3,4,6,9,12,18,24].concat(f.cuotas&&![1,2,3,4,6,9,12,18,24].includes(f.cuotas)?[f.cuotas]:[]).map(n=>`<option value="${n}" ${n==f.cuotas?"selected":""}>${n===1?"Un pago":n+" cuotas"}</option>`).join("")}</select></div>
        <div class="field"><label for="fCard">Tarjeta</label><select id="fCard"><option value="">${f.cuotas>1?"Elegí":"Ninguna / efectivo"}</option>${state.settings.cards.map(c=>`<option ${c.n===f.card?"selected":""}>${esc(c.n)}</option>`).join("")}</select></div>
      </div>${f.cuotas>1 && +f.amount>0?`<p class="note" style="margin:0">${f.cuotas} cuotas de ${money(f.amount/f.cuotas,f.currency)}.</p>`:""}`:""}
      <button class="btn primary" type="submit">Guardar</button>
      ${existing?`<button class="btn danger" type="button" id="sdel">${existing.kind==="fijo" ? (confirmDel?"Tocá de nuevo para dar de baja":"Dar de baja") : (confirmDel?"Tocá de nuevo para borrar":"Borrar")}</button>`:""}
    </form></div>`;
    const g=id=>root.querySelector(id);
    const sync=()=>{ f.amount=g("#fAmt").value; f.currency=g("#fCur").value; f.desc=g("#fDesc").value; f.cat=g("#fCat").value; f.sub=g("#fSub")?(g("#fSub").value||null):null; f.date=g("#fDate").value||todayISO(); if(g("#fCuo")){ f.cuotas=+g("#fCuo").value; } if(g("#fCard")) f.card=g("#fCard").value||null; if(g("#fFijo")) f.fijo=g("#fFijo").checked; };
    g("#sclose").onclick=close; g("#sbg").onclick=e=>{ if(e.target.id==="sbg") close(); };
    g("#fCat").onchange=()=>{ sync(); f.sub=null; draw(); };
    root.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ sync(); f.tipo=b.dataset.t; if(f.tipo==="ingreso"){f.cuotas=1; f.fijo=false;} draw(); });
    if(g("#fCuo")) g("#fCuo").onchange=()=>{ sync(); if(f.cuotas>1&&!f.card) f.card=state.settings.defCard; draw(); };
    if(g("#fFijo")) g("#fFijo").onchange=()=>{ sync(); if(f.fijo) f.cuotas=1; draw(); };
    if(g("#sdel")) g("#sdel").onclick=()=>{
      if(!confirmDel){ sync(); confirmDel=true; draw(); return; }
      const curM=monthKey(new Date());
      if(existing.kind==="fijo" && monthDiff(existing.start,curM)>0){ saveItem({...existing, until:addMonths(curM,-1)}); close(); showToast("Dado de baja desde este mes. Los meses anteriores quedan como estaban."); }
      else { deleteItem(existing.id); close(); showToast("Borrado."); }
    };
    g("#sform").onsubmit=e=>{ e.preventDefault(); sync();
      const amt=num(String(f.amount).replace(/\.(?=\d{3}(\D|$))/g,"")); if(!(amt>0)){ g("#fAmt").focus(); return; }
      const isFijo = f.tipo==="gasto" && !!f.fijo;
      const newKind = isFijo ? "fijo" : (f.tipo==="gasto"&&f.cuotas>1) ? "cuota" : "mov";
      const it=buildItem({tipo:f.tipo,amount:amt,currency:f.currency,cat:f.cat,sub:f.tipo==="gasto"?f.sub:null,desc:cap(f.desc)||CATS[f.cat].n,cuotas:f.tipo==="gasto"&&!isFijo?f.cuotas:1,card:f.card,fijo:isFijo}, f.date, existing && existing.kind===newKind ? existing.id : null);
      if(existing && existing.kind==="fijo" && it.kind==="fijo" && f.date===existing.date){ it.start=existing.start; it.until=existing.until||null; }
      if(existing && it.id!==existing.id) deleteItem(existing.id);
      saveItem(it); learnFrom(it); close();
      const label = it.kind==="fijo" ? `Anotado como fijo: ${esc(it.desc)} · ${money(it.amount,it.currency)} todos los meses` : `Anotado: ${esc(it.desc)} · ${money(it.kind==="cuota"?it.total:it.amount,it.currency)}`;
      showToast(existing?"Cambios guardados.":label, existing?null:it.id);
    };
  };
  const close=()=>{ root.innerHTML=""; };
  draw();
}

/* ---------- carga rápida ---------- */
let quickBusy=false;
async function quickAdd(text){
  text=text.trim(); if(!text || quickBusy) return;
  quickBusy=true;
  try{ await quickAddInner(text); } finally { quickBusy=false; }
}
async function quickAddInner(text){
  document.getElementById("quickIn").value="";
  const ga=matchGoalAporte(wordsToDigits(text));
  if(ga){ const a=addAporte(ga.g, ga.amount, ga.date); const p=Math.round(Math.min(100,Math.max(0,goalSaved(ga.g)/ga.g.target*100)));
    showToast(`Sumado a ${esc(ga.g.name)}: ${money(ga.amount,ga.g.currency)} · vas ${p}%`, null, ()=>{ ga.g.aportes=ga.g.aportes.filter(x=>x.id!==a.id); saveSettings(); }); return; }
  let p=parseLocal(text);
  if(!p){ if(sampleFn){ busyToast("Interpretando…"); p=await parseWithClaude(text); } }
  if(p && p.tipo==="gasto" && !p.sub) p.sub=guessSub(text,p.cat);
  if(!p){ document.getElementById("quickIn").value=text; showToast("No encontré el monto. Probá con “gasté 5 lucas en el súper”."); return; }
  const it=buildItem(p, p.date||null);
  await saveItem(it); learnFrom(it);
  const extra = it.kind==="cuota" ? ` en ${it.cuotas} cuotas de ${money(it.total/it.cuotas,it.currency)} (${esc(it.card)})` : it.kind==="fijo" ? " todos los meses (fijo)" : "";
  const when = it.date!==todayISO() ? ` · ${new Date(it.date+"T12:00:00").toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"})}` : "";
  showToast(`Anotado: ${esc(it.desc)}${it.desc===CATS[it.cat].n?"":" · "+CATS[it.cat].n} · ${money(it.kind==="cuota"?it.total:it.amount,it.currency)}${extra}${when}`, it.id);
  const mk = it.kind==="cuota"? it.first : it.date.slice(0,7);
  if(state.tab==="inicio" && mk!==state.month){ state.month=mk; render(); }
}
document.getElementById("quickForm").onsubmit=e=>{ e.preventDefault(); quickAdd(document.getElementById("quickIn").value); };
document.getElementById("hints").onclick=e=>{ const b=e.target.closest(".chip"); if(b){ const i=document.getElementById("quickIn"); i.value=b.textContent; i.focus(); } };
/* micrófono: reconocimiento de voz del navegador (Chrome en Android) */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, listening=false;
document.getElementById("micBtn").onclick=()=>{
  const btn=document.getElementById("micBtn"), inp=document.getElementById("quickIn");
  if(!SR){ inp.focus(); showToast("Este navegador no reconoce voz. Usá el micrófono del teclado y después tocá Anotar."); return; }
  if(listening){ rec && rec.stop(); return; }
  rec=new SR(); rec.lang="es-AR"; rec.interimResults=true; rec.maxAlternatives=1; rec.continuous=false;
  let finalText="", hadError=false;
  rec.onstart=()=>{ listening=true; btn.classList.add("listening"); btn.setAttribute("aria-label","Dejar de escuchar"); busyToast("Te escucho… decí por ejemplo “gasté cinco lucas en el súper”"); };
  rec.onresult=e=>{ let t=""; for(let i=0;i<e.results.length;i++){ t+=e.results[i][0].transcript; if(e.results[i].isFinal) finalText=t; } inp.value=t; };
  rec.onerror=e=>{ hadError=true; const m = e.error==="not-allowed"||e.error==="service-not-allowed" ? "Bolsillo no tiene permiso para el micrófono. Activalo en los ajustes del sitio en Chrome." : e.error==="no-speech" ? "No escuché nada. Tocá el micrófono y probá de nuevo." : e.error==="network" ? "El reconocimiento de voz necesita internet." : "No pude escucharte. Probá de nuevo."; showToast(m); };
  rec.onend=()=>{ listening=false; btn.classList.remove("listening"); btn.setAttribute("aria-label","Dictar por voz");
    const t=(finalText||inp.value).trim();
    if(t){ quickAdd(t); } else if(!hadError) document.getElementById("toast").hidden=true; };
  try{ rec.start(); }catch(e){ showToast("No pude abrir el micrófono. Probá de nuevo."); }
};

async function processReceiptFile(file){
  if(!canImages){ showToast("Para leer facturas, cargá tu clave de Gemini en Ajustes."); return; }
  const isPDF = file.type==="application/pdf" || /\.pdf$/i.test(file.name||"");
  if(!isPDF && !/^image\//.test(file.type||"")){ showToast("Ese archivo no es una foto ni un PDF."); return; }
  if(file.size > 18*1024*1024){ showToast("El archivo es muy pesado (más de 18 MB)."); return; }
  busyToast(isPDF ? "Leyendo el PDF…" : "Leyendo la factura…");
  try{
    let blob, preview;
    if(isPDF){ blob = file.type==="application/pdf" ? file : new Blob([file],{type:"application/pdf"}); preview = file.name || "factura.pdf"; }
    else { const c=await compressImage(file); blob=c.blob; preview=c.url; }
    const r=await readReceipt(blob);
    document.getElementById("toast").hidden=true;
    if(!r || r.error || !(+r.total>0)){ showToast("No pude leer el total. Completalo a mano."); openForm({tipo:"gasto",amount:"",currency:"ARS",cat:"otros",desc:r?.comercio||"",cuotas:1,card:null},null,preview); return; }
    const cat = CATS[r.categoria]? r.categoria : guessCat(r.comercio||"","gasto");
    let card=null; if(r.tarjeta){ const c=state.settings.cards.find(c=>new RegExp(c.n.split(" ")[0],"i").test(r.tarjeta)); card=c?c.n:null; }
    openForm({tipo:r.tipo==="ingreso"?"ingreso":"gasto", amount:+r.total, currency:r.moneda==="USD"?"USD":"ARS", cat, desc:cap(r.comercio||"Compra"), sub:guessSub(r.comercio||"",cat), cuotas:Math.max(1,parseInt(r.cuotas||1,10)), card, date:/^\d{4}-\d{2}-\d{2}$/.test(r.fecha||"")?r.fecha:todayISO()}, null, preview);
  }catch(err){
    if(err && err.code==="rate_limited") showToast("Llegaste al límite gratis de Gemini por ahora. Esperá un minuto y probá de nuevo.");
    else if(err && err.code==="bad_key") showToast("Gemini rechazó la clave. Revisala en Ajustes.");
    else if(err && err.code==="bad_model") showToast("Ese modelo de Gemini no existe. Revisá el nombre en Ajustes.");
    else if(err && err.code==="offline") { showToast("Sin conexión: cargala a mano."); openForm({tipo:"gasto",amount:"",currency:"ARS",cat:"otros",desc:"",cuotas:1,card:null},null); }
    else showToast(isPDF ? "No pude leer el PDF. Probá con una captura de la factura." : "No pude leer la foto. Probá con más luz y el ticket entero en cuadro.");
  }
}
document.getElementById("camIn").onchange=e=>{ const f=e.target.files[0]; e.target.value=""; if(f) processReceiptFile(f); };
document.getElementById("fileIn").onchange=e=>{ const f=e.target.files[0]; e.target.value=""; if(f) processReceiptFile(f); };

/* llega algo desde el menú Compartir de Android */
async function handleShared(){
  if(!/[?&]compartido=1/.test(location.search)) return;
  history.replaceState(null,"",location.pathname);
  try{
    const c=await caches.open("bolsillo-compartido");
    const fr=await c.match("archivo"); const tr=await c.match("texto");
    const text = tr ? (await tr.text()).trim() : "";
    await c.delete("archivo"); await c.delete("texto");
    if(fr){ const blob=await fr.blob(); const name=decodeURIComponent(fr.headers.get("x-nombre")||"factura"); processReceiptFile(new File([blob],name,{type:blob.type})); return; }
    if(text){ const inp=document.getElementById("quickIn"); inp.value=text.slice(0,300); inp.focus(); showToast("Recibí este texto. Revisalo y tocá Anotar."); return; }
    showToast("No llegó ningún archivo. Probá compartir la factura de nuevo.");
  }catch(e){ showToast("No pude abrir lo que compartiste."); }
}

/* cotización automática desde DolarApi (toma los valores de DolarHoy y otras fuentes) */
const CASAS={Blue:"blue",MEP:"bolsa",Oficial:"oficial",Tarjeta:"tarjeta",Cripto:"cripto",CCL:"contadoconliqui"};
let rateBusy=false;
async function updateRate(force){
  const s=state.settings; if(!s.rateAuto || rateBusy) return;
  if(!force && s.rateUpdated && Date.now()-s.rateFetchedAt < 30*60*1000) return;
  rateBusy=true;
  try{
    const res=await fetch("https://dolarapi.com/v1/dolares",{cache:"no-store"});
    if(!res.ok) throw 0;
    const list=await res.json(); const d=list.find(x=>x.casa===CASAS[s.rateName]);
    if(d && +d.venta>0){ s.rate=+d.venta; s.rateUpdated=d.fechaActualizacion||new Date().toISOString(); s.rateFetchedAt=Date.now(); s.rateError=false; saveSettings(); }
  }catch(e){ s.rateError=true; render(); }
  rateBusy=false;
}
function rateWhen(){
  const s=state.settings; if(!s.rateUpdated) return "";
  const d=new Date(s.rateUpdated); const today=new Date().toDateString()===d.toDateString();
  return (today?"hoy ":d.toLocaleDateString("es-AR",{day:"numeric",month:"short"})+" ")+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
}
